[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-dna"
version = "0.1.0"
description = "Omni-Modal AI DNA Architecture: Genotypic Instinct Encoding, Phenotypic Transferability, and Multi-Generational AI Evolution"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.22.0",
    "scipy>=1.8.0",
    "matplotlib>=3.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]
gpu = [
    "triton>=2.0.0; sys_platform != 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
